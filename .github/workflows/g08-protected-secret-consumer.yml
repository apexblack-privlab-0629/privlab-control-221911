name: G08 protected secret consumer
on:
  push:
    branches:
      - main
permissions:
  actions: read
  contents: read
jobs:
  protected-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run owner-authored protected consumer
        env:
          SENTINEL: ${{ secrets.G08_OWNER_SECRET_SENTINEL_1785802150 }}
        run: bash scripts/consumer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: g08-protected-secret-observer
          path: protected-secret.txt