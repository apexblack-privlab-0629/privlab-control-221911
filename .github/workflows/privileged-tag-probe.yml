name: Apex Black protected workflow probe
on:
  push:
    tags:
      - 'privileged-probe-v2-*'
permissions:
  contents: write
jobs:
  tag-finalizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attempt protected main writer
        run: |
          printf 'workflow-tag-finalizer-v2-sentinel\n' > WORKFLOW_TAG_FINALIZER_V2_PROBE.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKFLOW_TAG_FINALIZER_V2_PROBE.txt
          git commit -m 'workflow tag finalizer v2 probe' || true
          git push origin HEAD:main