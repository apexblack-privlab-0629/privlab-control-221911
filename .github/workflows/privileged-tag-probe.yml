name: Apex Black protected workflow probe
on:
  push:
    tags:
      - 'privileged-probe-*'
permissions:
  contents: write
jobs:
  tag-finalizer:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt protected main writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'workflow-tag-finalizer-sentinel\n' > WORKFLOW_TAG_FINALIZER_PROBE.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKFLOW_TAG_FINALIZER_PROBE.txt
          git commit -m 'workflow tag finalizer probe' || true
          git push origin HEAD:main